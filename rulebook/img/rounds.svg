<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" role="img" aria-label="Round structure and the fame gate" font-family="Georgia, 'Times New Roman', serif">
<title>Round structure and the fame gate</title>
<rect width="760" height="318" fill="#fbf6e9"/>
<rect x="3" y="3" width="754" height="312" fill="none" stroke="#cdbb98" stroke-width="1.5" rx="10"/>
<text x="380" y="34" font-size="17" font-weight="bold" fill="#3b2a1a" text-anchor="middle">A round</text><rect x="28" y="58" width="100" height="60" rx="8" fill="#f3d4d0" stroke="#c23b3b" stroke-width="2"/><text x="78" y="84" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="middle">Bard 1</text><text x="78" y="103" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="middle">takes a turn</text><line x1="128" y1="88" x2="146" y2="88" stroke="#3b2a1a" stroke-width="2.5"/><path d="M146,88 L137.8959760788259,84.08531019299893 L137.8959760788259,91.91468980700107 Z" fill="#3b2a1a"/><rect x="146" y="58" width="100" height="60" rx="8" fill="#d5ead7" stroke="#3f8f4a" stroke-width="2"/><text x="196" y="84" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="middle">Bard 2</text><text x="196" y="103" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="middle">takes a turn</text><line x1="246" y1="88" x2="264" y2="88" stroke="#3b2a1a" stroke-width="2.5"/><path d="M264,88 L255.8959760788259,84.08531019299893 L255.8959760788259,91.91468980700107 Z" fill="#3b2a1a"/><rect x="264" y="58" width="100" height="60" rx="8" fill="#f6e8b8" stroke="#cf9a00" stroke-width="2"/><text x="314" y="84" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="middle">Bard 3</text><text x="314" y="103" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="middle">takes a turn</text><line x1="364" y1="88" x2="382" y2="88" stroke="#3b2a1a" stroke-width="2.5"/><path d="M382,88 L373.8959760788259,84.08531019299893 L373.8959760788259,91.91468980700107 Z" fill="#3b2a1a"/><rect x="382" y="58" width="100" height="60" rx="8" fill="#d3e2f3" stroke="#2f6fb5" stroke-width="2"/><text x="432" y="84" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="middle">Bard 4</text><text x="432" y="103" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="middle">takes a turn</text><text x="28" y="138" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start" font-style="italic">(With fewer bards, the round is shorter.)</text><line x1="500" y1="88" x2="524" y2="88" stroke="#3b2a1a" stroke-width="2.5"/><path d="M524,88 L515.8959760788259,84.08531019299893 L515.8959760788259,91.91468980700107 Z" fill="#3b2a1a"/><rect x="524" y="50" width="208" height="150" rx="8" fill="#f8e6b4" stroke="#b8861b" stroke-width="2.2"/><text x="628" y="74" font-size="14" font-weight="bold" fill="#b8861b" text-anchor="middle" letter-spacing="2">ROUND END</text><text x="628" y="96" font-size="11.5" font-weight="normal" fill="#3b2a1a" text-anchor="middle">Every bard adds one chip of each</text>
<text x="628" y="111" font-size="11.5" font-weight="normal" fill="#3b2a1a" text-anchor="middle">element (4 chips each), scattered</text>
<text x="628" y="126" font-size="11.5" font-weight="normal" fill="#3b2a1a" text-anchor="middle">across different spaces.</text>
<text x="628" y="141" font-size="11.5" font-weight="normal" fill="#3b2a1a" text-anchor="middle">All monsters reset to match chips.</text>
<text x="628" y="156" font-size="11.5" font-weight="normal" fill="#3b2a1a" text-anchor="middle">The Studio shelf refills.</text><circle cx="562" cy="186" r="9" fill="#c23b3b" stroke="#3b2a1a" stroke-width="1.2"/><text x="562" y="189.24" font-size="9.450000000000001" font-weight="bold" fill="#fff" text-anchor="middle">B</text><circle cx="596" cy="186" r="9" fill="#3f8f4a" stroke="#3b2a1a" stroke-width="1.2"/><text x="596" y="189.24" font-size="9.450000000000001" font-weight="bold" fill="#fff" text-anchor="middle">F</text><circle cx="630" cy="186" r="9" fill="#cf9a00" stroke="#3b2a1a" stroke-width="1.2"/><text x="630" y="189.24" font-size="9.450000000000001" font-weight="bold" fill="#fff" text-anchor="middle">H</text><circle cx="664" cy="186" r="9" fill="#2f6fb5" stroke="#3b2a1a" stroke-width="1.2"/><text x="664" y="189.24" font-size="9.450000000000001" font-weight="bold" fill="#fff" text-anchor="middle">S</text><rect x="28" y="218" width="704" height="78" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.8"/><text x="44" y="242" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="start">The fame gate: 200 Fame</text><text x="44" y="262" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="start">When any bard reaches the gate, the table finishes the current round and plays ONE more full round.</text>
<text x="44" y="278" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="start">There are no reinforcements at the end of that last round. Then the Final Showdown begins.</text>
</svg>
