<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" role="img" aria-label="The four steps of a turn" font-family="Georgia, 'Times New Roman', serif">
<title>The four steps of a turn</title>
<rect width="760" height="276" fill="#fbf6e9"/>
<rect x="3" y="3" width="754" height="270" fill="none" stroke="#cdbb98" stroke-width="1.5" rx="10"/>
<text x="380" y="34" font-size="17" font-weight="bold" fill="#3b2a1a" text-anchor="middle">Your turn</text><rect x="28" y="56" width="166" height="170" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.8"/><rect x="28" y="56" width="166" height="36" rx="8" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.8"/><circle cx="48" cy="74" r="13" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.5"/><text x="48" y="79" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle">1</text><text x="68" y="80" font-size="15" font-weight="bold" fill="#fbf6e9" text-anchor="start" letter-spacing="1.5">MOVE</text><text x="111" y="120" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="middle">up to 2 spaces</text><text x="111" y="146" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle">Each step is one</text>
<text x="111" y="161" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle">move. Take back the</text>
<text x="111" y="176" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle">last step until you</text>
<text x="111" y="191" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle">fight.</text><line x1="194" y1="141" x2="209" y2="141" stroke="#3b2a1a" stroke-width="2.5"/><path d="M209,141 L200.8959760788259,137.08531019299892 L200.8959760788259,144.91468980700108 Z" fill="#3b2a1a"/><rect x="209" y="56" width="166" height="170" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.8"/><rect x="209" y="56" width="166" height="36" rx="8" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.8"/><circle cx="229" cy="74" r="13" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.5"/><text x="229" y="79" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle">2</text><text x="249" y="80" font-size="15" font-weight="bold" fill="#fbf6e9" text-anchor="start" letter-spacing="1.5">FIGHT</text><text x="292" y="120" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="middle">1 fight</text><text x="292" y="146" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle">Optional. Play songs</text>
<text x="292" y="161" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle">against the monsters</text>
<text x="292" y="176" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle">where you stand.</text><line x1="375" y1="141" x2="390" y2="141" stroke="#3b2a1a" stroke-width="2.5"/><path d="M390,141 L381.8959760788259,137.08531019299892 L381.8959760788259,144.91468980700108 Z" fill="#3b2a1a"/><rect x="390" y="56" width="166" height="170" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.8"/><rect x="390" y="56" width="166" height="36" rx="8" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.8"/><circle cx="410" cy="74" r="13" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.5"/><text x="410" y="79" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle">3</text><text x="430" y="80" font-size="15" font-weight="bold" fill="#fbf6e9" text-anchor="start" letter-spacing="1.5">STUDIO</text><text x="473" y="120" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="middle">any time, not mid-fight</text><text x="473" y="146" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle">Spend EXP and</text>
<text x="473" y="161" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle">Inspiration on dice</text>
<text x="473" y="176" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle">and styles.</text><line x1="556" y1="141" x2="571" y2="141" stroke="#3b2a1a" stroke-width="2.5"/><path d="M571,141 L562.8959760788259,137.08531019299892 L562.8959760788259,144.91468980700108 Z" fill="#3b2a1a"/><rect x="571" y="56" width="166" height="170" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.8"/><rect x="571" y="56" width="166" height="36" rx="8" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.8"/><circle cx="591" cy="74" r="13" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.5"/><text x="591" y="79" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle">4</text><text x="611" y="80" font-size="15" font-weight="bold" fill="#fbf6e9" text-anchor="start" letter-spacing="1.5">END TURN</text><text x="654" y="120" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="middle">pass the lute</text><text x="654" y="146" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle">Unspent EXP is yours</text>
<text x="654" y="161" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle">to keep for later.</text><text x="380" y="254" font-size="12.5" font-weight="normal" fill="#7a6650" text-anchor="middle" font-style="italic">Moving and the Studio can happen in any order around your fight. You only ever get one fight.</text>
</svg>
