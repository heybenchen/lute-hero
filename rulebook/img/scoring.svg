<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Scoring example: board Fame plus Showdown fandom" font-family="Georgia, 'Times New Roman', serif">
<title>Scoring example: board Fame plus Showdown fandom</title>
<rect width="760" height="300" fill="#fbf6e9"/>
<rect x="3" y="3" width="754" height="294" fill="none" stroke="#cdbb98" stroke-width="1.5" rx="10"/>
<text x="380" y="34" font-size="17" font-weight="bold" fill="#3b2a1a" text-anchor="middle">Scoring: an example</text><text x="30" y="92" font-size="15" font-weight="bold" fill="#3b2a1a" text-anchor="start">Ava</text><rect x="90" y="66" width="428" height="38" rx="4" fill="#f3d4d0" stroke="#c23b3b" stroke-width="1.6"/><text x="304" y="91" font-size="12.5" font-weight="normal" fill="#3b2a1a" text-anchor="middle">214 board Fame</text><rect x="518" y="66" width="122" height="38" rx="4" fill="#c23b3b" stroke="#c23b3b" stroke-width="1.5"/><text x="579" y="91" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">+61</text><text x="650" y="92" font-size="17" font-weight="bold" fill="#3b2a1a" text-anchor="start">= 275</text><text x="30" y="152" font-size="15" font-weight="bold" fill="#3b2a1a" text-anchor="start">Ben</text><rect x="90" y="126" width="402" height="38" rx="4" fill="#d5ead7" stroke="#3f8f4a" stroke-width="1.6"/><text x="291" y="151" font-size="12.5" font-weight="normal" fill="#3b2a1a" text-anchor="middle">201 board Fame</text><rect x="492" y="126" width="168" height="38" rx="4" fill="#3f8f4a" stroke="#3f8f4a" stroke-width="1.5"/><text x="576" y="151" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">+84</text><text x="670" y="152" font-size="17" font-weight="bold" fill="#3b2a1a" text-anchor="start">= 285</text><text x="30" y="212" font-size="15" font-weight="bold" fill="#3b2a1a" text-anchor="start">Cam</text><rect x="90" y="186" width="376" height="38" rx="4" fill="#f6e8b8" stroke="#cf9a00" stroke-width="1.6"/><text x="278" y="211" font-size="12.5" font-weight="normal" fill="#3b2a1a" text-anchor="middle">188 board Fame</text><rect x="466" y="186" width="140" height="38" rx="4" fill="#cf9a00" stroke="#cf9a00" stroke-width="1.5"/><text x="536" y="211" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">+70</text><text x="616" y="212" font-size="17" font-weight="bold" fill="#3b2a1a" text-anchor="start">= 258</text><text x="380" y="258" font-size="12.5" font-weight="normal" fill="#7a6650" text-anchor="middle" font-style="italic">Ben wins on 285 Fame (201 board + 84 fandom), though Ava led on the board.</text><text x="380" y="276" font-size="12.5" font-weight="normal" fill="#7a6650" text-anchor="middle" font-style="italic">Tied on Fame? The bard with more Showdown fandom wins.</text>
</svg>
