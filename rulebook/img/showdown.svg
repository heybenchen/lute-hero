<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" role="img" aria-label="Three verses of the Final Showdown" font-family="Georgia, 'Times New Roman', serif">
<title>Three verses of the Final Showdown</title>
<rect width="760" height="384" fill="#fbf6e9"/>
<rect x="3" y="3" width="754" height="378" fill="none" stroke="#cdbb98" stroke-width="1.5" rx="10"/>
<text x="380" y="34" font-size="17" font-weight="bold" fill="#3b2a1a" text-anchor="middle">The Final Showdown: three verses</text><rect x="24" y="54" width="222" height="232" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.6"/><rect x="24" y="54" width="222" height="30" rx="8" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.6"/><text x="135" y="75" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle" letter-spacing="1.5">VERSE 1</text><text x="135" y="100" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">Each bard performs once, in turn:</text>
<text x="135" y="116" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">pick ONE element.</text>
<text x="135" y="132" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">Every die of that element</text>
<text x="135" y="148" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">in your setlist rolls together.</text>
<text x="135" y="164" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">The total is your fandom.</text><rect x="38" y="190" width="194" height="46" rx="8" fill="#e3efe0" stroke="#3f8f4a" stroke-width="1.8"/><text x="135" y="210" font-size="11" font-weight="normal" fill="#3b2a1a" text-anchor="middle">The Silence is not immune</text>
<text x="135" y="224" font-size="11" font-weight="normal" fill="#3b2a1a" text-anchor="middle">to anything yet.</text><text x="135" y="262" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="middle" font-style="italic">No weakness, ever: ×1 or ×0.</text><line x1="246" y1="170" x2="262" y2="170" stroke="#3b2a1a" stroke-width="2.5"/><path d="M262,170 L253.8959760788259,166.08531019299892 L253.8959760788259,173.91468980700108 Z" fill="#3b2a1a"/><rect x="262" y="54" width="222" height="232" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.6"/><rect x="262" y="54" width="222" height="30" rx="8" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.6"/><text x="373" y="75" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle" letter-spacing="1.5">VERSE 2</text><text x="373" y="100" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">Each bard performs once, in turn:</text>
<text x="373" y="116" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">pick ONE element.</text>
<text x="373" y="132" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">Every die of that element</text>
<text x="373" y="148" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">in your setlist rolls together.</text>
<text x="373" y="164" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">The total is your fandom.</text><rect x="276" y="190" width="194" height="46" rx="8" fill="#e6d2cc" stroke="#9a4a3a" stroke-width="1.8"/><text x="373" y="210" font-size="11" font-weight="normal" fill="#3b2a1a" text-anchor="middle">The Silence is IMMUNE (×0) to the</text>
<text x="373" y="224" font-size="11" font-weight="normal" fill="#3b2a1a" text-anchor="middle">element of the last verse’s best.</text><text x="373" y="262" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="middle" font-style="italic">No weakness, ever: ×1 or ×0.</text><line x1="484" y1="170" x2="500" y2="170" stroke="#3b2a1a" stroke-width="2.5"/><path d="M500,170 L491.8959760788259,166.08531019299892 L491.8959760788259,173.91468980700108 Z" fill="#3b2a1a"/><rect x="500" y="54" width="222" height="232" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.6"/><rect x="500" y="54" width="222" height="30" rx="8" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.6"/><text x="611" y="75" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle" letter-spacing="1.5">VERSE 3</text><text x="611" y="100" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">Each bard performs once, in turn:</text>
<text x="611" y="116" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">pick ONE element.</text>
<text x="611" y="132" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">Every die of that element</text>
<text x="611" y="148" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">in your setlist rolls together.</text>
<text x="611" y="164" font-size="12" font-weight="normal" fill="#3b2a1a" text-anchor="middle">The total is your fandom.</text><rect x="514" y="190" width="194" height="46" rx="8" fill="#e6d2cc" stroke="#9a4a3a" stroke-width="1.8"/><text x="611" y="210" font-size="11" font-weight="normal" fill="#3b2a1a" text-anchor="middle">The Silence is IMMUNE (×0) to the</text>
<text x="611" y="224" font-size="11" font-weight="normal" fill="#3b2a1a" text-anchor="middle">element of the last verse’s best.</text><text x="611" y="262" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="middle" font-style="italic">No weakness, ever: ×1 or ×0.</text><rect x="24" y="304" width="712" height="58" rx="8" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.5"/><text x="380" y="330" font-size="16" font-weight="bold" fill="#fbf6e9" text-anchor="middle">After verse 3, each bard’s fandom is added to their Fame.</text><text x="380" y="351" font-size="13" font-weight="normal" fill="#e9dcbf" text-anchor="middle">Highest Fame wins.</text>
</svg>
