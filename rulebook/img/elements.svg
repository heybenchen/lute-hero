<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="Element cross: a monster is weak to its own element and immune to the opposite one" font-family="Georgia, 'Times New Roman', serif">
<title>Element cross: a monster is weak to its own element and immune to the opposite one</title>
<rect width="560" height="440" fill="#fbf6e9"/>
<rect x="3" y="3" width="554" height="434" fill="none" stroke="#cdbb98" stroke-width="1.5" rx="10"/>
<text x="280" y="34" font-size="17" font-weight="bold" fill="#3b2a1a" text-anchor="middle">Elements: weak and immune</text><line x1="280" y1="94" x2="280" y2="350" stroke="#9a4a3a" stroke-width="6"/><line x1="94.4" y1="222" x2="465.6" y2="222" stroke="#9a4a3a" stroke-width="6"/><circle cx="280" cy="222" r="30" fill="#e6d2cc" stroke="#9a4a3a" stroke-width="2.5"/><text x="280" y="228" font-size="19" font-weight="bold" fill="#9a4a3a" text-anchor="middle">×0</text><circle cx="280" cy="94" r="40" fill="#c23b3b" stroke="#3b2a1a" stroke-width="2"/><text x="280" y="99" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Ballad</text><text x="332" y="99" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="start">×2 to itself</text><circle cx="94.4" cy="222" r="40" fill="#3f8f4a" stroke="#3b2a1a" stroke-width="2"/><text x="94.4" y="227" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Folk</text><text x="94.4" y="284" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="middle">×2 to itself</text><circle cx="465.6" cy="222" r="40" fill="#cf9a00" stroke="#3b2a1a" stroke-width="2"/><text x="465.6" y="227" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Hymn</text><text x="465.6" y="284" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="middle">×2 to itself</text><circle cx="280" cy="350" r="40" fill="#2f6fb5" stroke="#3b2a1a" stroke-width="2"/><text x="280" y="355" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Shanty</text><text x="332" y="355" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="start">×2 to itself</text><text x="280" y="420" font-size="13.5" font-weight="normal" fill="#3b2a1a" text-anchor="middle">Same element: ×2 (weak).  Across the cross: ×0 (immune).  Next door: ×1.</text>
</svg>
