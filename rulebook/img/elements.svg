<title>Element matchup chart</title>
<rect width="760" height="392" fill="#fbf6e9"/>
<rect x="3" y="3" width="754" height="386" fill="none" stroke="#cdbb98" stroke-width="1.5" rx="10"/>
<text x="380" y="38" font-size="17" font-weight="bold" fill="#3b2a1a" text-anchor="middle">How much damage a song deals to a monster</text><text x="474" y="78" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle" letter-spacing="3">THE MONSTER'S ELEMENT</text><text x="100" y="106" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="middle" letter-spacing="3">YOUR SONG</text><rect x="214" y="88" width="124" height="32" rx="8" fill="#c23b3b" stroke="#3b2a1a" stroke-width="1.5"/><text x="276" y="109" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Ballad</text><rect x="30" y="120" width="172" height="46" rx="8" fill="#c23b3b" stroke="#3b2a1a" stroke-width="1.5"/><text x="116" y="148" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Ballad</text><rect x="344" y="88" width="124" height="32" rx="8" fill="#3f8f4a" stroke="#3b2a1a" stroke-width="1.5"/><text x="406" y="109" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Folk</text><rect x="30" y="172" width="172" height="46" rx="8" fill="#3f8f4a" stroke="#3b2a1a" stroke-width="1.5"/><text x="116" y="200" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Folk</text><rect x="474" y="88" width="124" height="32" rx="8" fill="#cf9a00" stroke="#3b2a1a" stroke-width="1.5"/><text x="536" y="109" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Hymn</text><rect x="30" y="224" width="172" height="46" rx="8" fill="#cf9a00" stroke="#3b2a1a" stroke-width="1.5"/><text x="116" y="252" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Hymn</text><rect x="604" y="88" width="124" height="32" rx="8" fill="#2f6fb5" stroke="#3b2a1a" stroke-width="1.5"/><text x="666" y="109" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Shanty</text><rect x="30" y="276" width="172" height="46" rx="8" fill="#2f6fb5" stroke="#3b2a1a" stroke-width="1.5"/><text x="116" y="304" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Shanty</text><rect x="214" y="120" width="124" height="46" rx="8" fill="#f8e6b4" stroke="#b8861b" stroke-width="2.5"/><text x="276" y="147" font-size="15" font-weight="bold" fill="#b8861b" text-anchor="middle">×2  weak</text><rect x="344" y="120" width="124" height="46" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.3"/><text x="406" y="147" font-size="14" font-weight="normal" fill="#7a6650" text-anchor="middle">×1</text><rect x="474" y="120" width="124" height="46" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.3"/><text x="536" y="147" font-size="14" font-weight="normal" fill="#7a6650" text-anchor="middle">×1</text><rect x="604" y="120" width="124" height="46" rx="8" fill="#e6d2cc" stroke="#9a4a3a" stroke-width="2.5"/><text x="666" y="147" font-size="15" font-weight="bold" fill="#9a4a3a" text-anchor="middle">×0  immune</text><rect x="214" y="172" width="124" height="46" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.3"/><text x="276" y="199" font-size="14" font-weight="normal" fill="#7a6650" text-anchor="middle">×1</text><rect x="344" y="172" width="124" height="46" rx="8" fill="#f8e6b4" stroke="#b8861b" stroke-width="2.5"/><text x="406" y="199" font-size="15" font-weight="bold" fill="#b8861b" text-anchor="middle">×2  weak</text><rect x="474" y="172" width="124" height="46" rx="8" fill="#e6d2cc" stroke="#9a4a3a" stroke-width="2.5"/><text x="536" y="199" font-size="15" font-weight="bold" fill="#9a4a3a" text-anchor="middle">×0  immune</text><rect x="604" y="172" width="124" height="46" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.3"/><text x="666" y="199" font-size="14" font-weight="normal" fill="#7a6650" text-anchor="middle">×1</text><rect x="214" y="224" width="124" height="46" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.3"/><text x="276" y="251" font-size="14" font-weight="normal" fill="#7a6650" text-anchor="middle">×1</text><rect x="344" y="224" width="124" height="46" rx="8" fill="#e6d2cc" stroke="#9a4a3a" stroke-width="2.5"/><text x="406" y="251" font-size="15" font-weight="bold" fill="#9a4a3a" text-anchor="middle">×0  immune</text><rect x="474" y="224" width="124" height="46" rx="8" fill="#f8e6b4" stroke="#b8861b" stroke-width="2.5"/><text x="536" y="251" font-size="15" font-weight="bold" fill="#b8861b" text-anchor="middle">×2  weak</text><rect x="604" y="224" width="124" height="46" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.3"/><text x="666" y="251" font-size="14" font-weight="normal" fill="#7a6650" text-anchor="middle">×1</text><rect x="214" y="276" width="124" height="46" rx="8" fill="#e6d2cc" stroke="#9a4a3a" stroke-width="2.5"/><text x="276" y="303" font-size="15" font-weight="bold" fill="#9a4a3a" text-anchor="middle">×0  immune</text><rect x="344" y="276" width="124" height="46" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.3"/><text x="406" y="303" font-size="14" font-weight="normal" fill="#7a6650" text-anchor="middle">×1</text><rect x="474" y="276" width="124" height="46" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.3"/><text x="536" y="303" font-size="14" font-weight="normal" fill="#7a6650" text-anchor="middle">×1</text><rect x="604" y="276" width="124" height="46" rx="8" fill="#f8e6b4" stroke="#b8861b" stroke-width="2.5"/><text x="666" y="303" font-size="15" font-weight="bold" fill="#b8861b" text-anchor="middle">×2  weak</text><text x="30" y="350" font-size="12.5" font-weight="normal" fill="#7a6650" text-anchor="start">A monster is named for its element. It is weak to songs of that element (double damage)</text><text x="30" y="368" font-size="12.5" font-weight="normal" fill="#7a6650" text-anchor="start">and immune to songs of the opposite element (none). Opposites: Ballad and Shanty, Folk and Hymn.</text>
</svg>
