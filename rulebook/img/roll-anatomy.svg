<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" role="img" aria-label="Worked example of a roll: 8 plus 5 plus 2 times 2 equals 30" font-family="Georgia, 'Times New Roman', serif">
<title>Worked example of a roll: 8 plus 5 plus 2 times 2 equals 30</title>
<rect width="760" height="318" fill="#fbf6e9"/>
<rect x="3" y="3" width="754" height="312" fill="none" stroke="#cdbb98" stroke-width="1.5" rx="10"/>
<text x="380" y="34" font-size="17" font-weight="bold" fill="#3b2a1a" text-anchor="middle">Reading a roll: an example</text><rect x="30" y="60" width="150" height="128" rx="8" fill="#f8e6b4" stroke="#3b2a1a" stroke-width="1.8"/><text x="105" y="82" font-size="12" font-weight="bold" fill="#7a6650" text-anchor="middle" letter-spacing="3">ROLL</text><text x="105" y="134" font-size="46" font-weight="bold" fill="#3b2a1a" text-anchor="middle">8</text><text x="105" y="160" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">A d8 lands on its top</text>
<text x="105" y="174" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">face</text><text x="192" y="134" font-size="26" font-weight="bold" fill="#b8861b" text-anchor="middle">+</text><rect x="205" y="60" width="150" height="128" rx="8" fill="#f8e6b4" stroke="#3b2a1a" stroke-width="1.8"/><text x="280" y="82" font-size="12" font-weight="bold" fill="#7a6650" text-anchor="middle" letter-spacing="3">CRIT</text><text x="280" y="134" font-size="46" font-weight="bold" fill="#3b2a1a" text-anchor="middle">+5</text><text x="280" y="160" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">Top face: roll the die</text>
<text x="280" y="174" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">again and add it</text><text x="367" y="134" font-size="26" font-weight="bold" fill="#b8861b" text-anchor="middle">+</text><rect x="380" y="60" width="150" height="128" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.8"/><text x="455" y="82" font-size="12" font-weight="bold" fill="#7a6650" text-anchor="middle" letter-spacing="3">STYLE</text><text x="455" y="134" font-size="46" font-weight="bold" fill="#3b2a1a" text-anchor="middle">+2</text><text x="455" y="160" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">A style adds to the</text>
<text x="455" y="174" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">roll’s value</text><text x="542" y="134" font-size="26" font-weight="bold" fill="#b8861b" text-anchor="middle">×</text><rect x="555" y="60" width="150" height="128" rx="8" fill="#e3efe0" stroke="#3b2a1a" stroke-width="1.8"/><text x="630" y="82" font-size="12" font-weight="bold" fill="#7a6650" text-anchor="middle" letter-spacing="3">ELEMENT</text><text x="630" y="134" font-size="46" font-weight="bold" fill="#3b2a1a" text-anchor="middle">×2</text><text x="630" y="160" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">The monster is weak to</text>
<text x="630" y="174" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">your element</text><rect x="30" y="218" width="700" height="54" rx="8" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.5"/><text x="380" y="252" font-size="20" font-weight="bold" fill="#fbf6e9" text-anchor="middle">(8 + 5 + 2) = 15,  then × 2  =  30 damage to the target</text><text x="380" y="296" font-size="12.5" font-weight="normal" fill="#7a6650" text-anchor="middle" font-style="italic">Add the roll, the crit dice and any style bonus first, then multiply by the element, and round down.</text>
</svg>
