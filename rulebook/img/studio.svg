<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="The Studio: shelves and what you can buy" font-family="Georgia, 'Times New Roman', serif">
<title>The Studio: shelves and what you can buy</title>
<rect width="760" height="420" fill="#fbf6e9"/>
<rect x="3" y="3" width="754" height="414" fill="none" stroke="#cdbb98" stroke-width="1.5" rx="10"/>
<rect x="24" y="24" width="712" height="372" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.6"/><rect x="24" y="24" width="712" height="30" rx="8" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.6"/><text x="380" y="45" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle" letter-spacing="1.5">THE STUDIO</text><text x="48" y="76" font-size="13" font-weight="bold" fill="#3b2a1a" text-anchor="start">Element shelf (4 chips, refilled after every turn)</text><circle cx="62" cy="104" r="16" fill="#3f8f4a" stroke="#3b2a1a" stroke-width="1.2"/><text x="62" y="109.76" font-size="16.8" font-weight="bold" fill="#fff" text-anchor="middle">F</text><circle cx="106" cy="104" r="16" fill="#2f6fb5" stroke="#3b2a1a" stroke-width="1.2"/><text x="106" y="109.76" font-size="16.8" font-weight="bold" fill="#fff" text-anchor="middle">S</text><circle cx="150" cy="104" r="16" fill="#c23b3b" stroke="#3b2a1a" stroke-width="1.2"/><text x="150" y="109.76" font-size="16.8" font-weight="bold" fill="#fff" text-anchor="middle">B</text><circle cx="194" cy="104" r="16" fill="#2f6fb5" stroke="#3b2a1a" stroke-width="1.2"/><text x="194" y="109.76" font-size="16.8" font-weight="bold" fill="#fff" text-anchor="middle">S</text><text x="48" y="150" font-size="13" font-weight="bold" fill="#3b2a1a" text-anchor="start">Style shelf (2 styles; a bard holds at most 2)</text><rect x="48" y="160" width="90" height="52" rx="8" fill="#fffdf6" stroke="#b8861b" stroke-width="2"/><text x="93" y="182" font-size="12" font-weight="bold" fill="#b8861b" text-anchor="middle">Style A</text><text x="93" y="200" font-size="10.5" font-weight="normal" fill="#7a6650" text-anchor="middle" font-style="italic">see Songbook</text><rect x="148" y="160" width="90" height="52" rx="8" fill="#fffdf6" stroke="#b8861b" stroke-width="2"/><text x="193" y="182" font-size="12" font-weight="bold" fill="#b8861b" text-anchor="middle">Style B</text><text x="193" y="200" font-size="10.5" font-weight="normal" fill="#7a6650" text-anchor="middle" font-style="italic">see Songbook</text><rect x="340" y="56" width="380" height="60" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5"/><text x="352" y="77" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="start">Buy a new d4</text><text x="708" y="77" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="end">1 EXP</text><text x="352" y="94" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="start">Take any shelf chip. The d4 of that element goes in an empty</text>
<text x="352" y="107" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="start">song, or replaces a die.</text><rect x="340" y="122" width="380" height="60" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5"/><text x="352" y="143" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="start">Upgrade a die</text><text x="708" y="143" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="end">2 / 2 / 4 EXP</text><text x="352" y="160" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="start">To d8 / d12 / d20. Also spend a shelf chip of the die’s</text>
<text x="352" y="173" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="start">element.</text><rect x="340" y="188" width="380" height="60" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5"/><text x="352" y="209" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="start">Buy Inspiration</text><text x="708" y="209" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="end">1 EXP</text><text x="352" y="226" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="start">Each one costs the same, however many you buy.</text><rect x="340" y="254" width="380" height="60" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5"/><text x="352" y="275" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="start">Learn a style</text><text x="708" y="275" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="end">price on the card</text><text x="352" y="292" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="start">Changes how all your songs play. Learning a third replaces</text>
<text x="352" y="305" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="start">one.</text><rect x="340" y="320" width="380" height="60" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5"/><text x="352" y="341" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="start">Refresh the shelves</text><text x="708" y="341" font-size="13" font-weight="bold" fill="#b8861b" text-anchor="end">1 Inspiration</text><text x="352" y="358" font-size="11" font-weight="normal" fill="#7a6650" text-anchor="start">Redraw all the element chips and both styles.</text><rect x="48" y="250" width="260" height="110" rx="8" fill="#f6f0dd" stroke="#cdbb98" stroke-width="1.5" stroke-dasharray="5 4"/><text x="60" y="276" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="start">EXP is earned in fights.</text>
<text x="60" y="292" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="start">Inspiration comes from clearing a</text>
<text x="60" y="308" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="start">space, or from the Studio.</text>
<text x="60" y="324" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="start">You keep both between turns.</text>
</svg>
