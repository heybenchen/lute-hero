<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" width="760" height="488" role="img" aria-label="Flow of a fight" font-family="Georgia, 'Times New Roman', serif">
<title>Flow of a fight</title>
<rect width="760" height="488" fill="#fbf6e9"/>
<rect x="3" y="3" width="754" height="482" fill="none" stroke="#cdbb98" stroke-width="1.5" rx="10"/>
<text x="380" y="32" font-size="17" font-weight="bold" fill="#3b2a1a" text-anchor="middle">Anatomy of a fight</text><rect x="28" y="52" width="200" height="66" rx="8" fill="#f8e6b4" stroke="#b8861b" stroke-width="1.8"/><text x="128" y="74" font-size="13.5" font-weight="bold" fill="#b8861b" text-anchor="middle">START</text><text x="128" y="93" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">Fight the monsters</text>
<text x="128" y="107" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">on your space (once a turn)</text><rect x="280" y="52" width="200" height="66" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.8"/><text x="380" y="74" font-size="13.5" font-weight="bold" fill="#3b2a1a" text-anchor="middle">1 · PICK A TARGET</text><text x="380" y="93" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">One monster at a time.</text>
<text x="380" y="107" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">Songs are single-target.</text><rect x="532" y="52" width="200" height="66" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.8"/><text x="632" y="74" font-size="13.5" font-weight="bold" fill="#3b2a1a" text-anchor="middle">2 · PLAY A SONG</text><text x="632" y="93" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">Tap a die to roll it.</text>
<text x="632" y="107" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">One die per song.</text><line x1="228" y1="85" x2="280" y2="85" stroke="#3b2a1a" stroke-width="2"/><path d="M280,85 L271.8959760788259,81.08531019299893 L271.8959760788259,88.91468980700107 Z" fill="#3b2a1a"/><line x1="480" y1="85" x2="532" y2="85" stroke="#3b2a1a" stroke-width="2"/><path d="M532,85 L523.8959760788259,81.08531019299893 L523.8959760788259,88.91468980700107 Z" fill="#3b2a1a"/><rect x="532" y="150" width="200" height="66" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.8"/><text x="632" y="172" font-size="13.5" font-weight="bold" fill="#3b2a1a" text-anchor="middle">3 · DAMAGE</text><text x="632" y="191" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">Roll + crits + bonuses,</text>
<text x="632" y="205" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">times the element, = damage</text><line x1="632" y1="118" x2="632" y2="150" stroke="#3b2a1a" stroke-width="2"/><path d="M632,150 L635.9146898070011,141.8959760788259 L628.0853101929989,141.8959760788259 Z" fill="#3b2a1a"/><line x1="532" y1="183" x2="480" y2="183" stroke="#3b2a1a" stroke-width="2"/><path d="M480,183 L488.1040239211741,186.91468980700108 L488.1040239211741,179.08531019299892 Z" fill="#3b2a1a"/><rect x="280" y="150" width="200" height="66" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.8"/><text x="380" y="172" font-size="13.5" font-weight="bold" fill="#3b2a1a" text-anchor="middle">Is the target at 0 HP?</text><text x="380" y="191" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">Yes → tamed.</text>
<text x="380" y="205" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">No → wounded.</text><line x1="380" y1="216" x2="142" y2="264" stroke="#3b2a1a" stroke-width="2"/><path d="M142,264 L150.7180055389021,266.23525824540974 L149.1701370800166,258.56041047010245 Z" fill="#3b2a1a"/><line x1="380" y1="216" x2="380" y2="264" stroke="#3b2a1a" stroke-width="2"/><path d="M380,264 L383.9146898070011,255.8959760788259 L376.0853101929989,255.8959760788259 Z" fill="#3b2a1a"/><line x1="380" y1="216" x2="618" y2="264" stroke="#3b2a1a" stroke-width="2"/><path d="M618,264 L610.8298629199834,258.56041047010245 L609.281994461098,266.23525824540974 Z" fill="#3b2a1a"/><rect x="28" y="264" width="228" height="92" rx="8" fill="#e3efe0" stroke="#3f8f4a" stroke-width="1.8"/><text x="142" y="286" font-size="13.5" font-weight="bold" fill="#3f8f4a" text-anchor="middle">TAMED</text><text x="142" y="305" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">You earn its Fame.</text>
<text x="142" y="319" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">The die comes back: that</text>
<text x="142" y="333" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">song can be played again.</text><rect x="266" y="264" width="228" height="92" rx="8" fill="#fbf0d2" stroke="#b8861b" stroke-width="1.8"/><text x="380" y="286" font-size="13.5" font-weight="bold" fill="#b8861b" text-anchor="middle">WOUNDED</text><text x="380" y="305" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">The song is spent this fight.</text>
<text x="380" y="319" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">The target is locked in until</text>
<text x="380" y="333" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">it is tamed or you retreat.</text><rect x="504" y="264" width="228" height="92" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.8"/><text x="618" y="286" font-size="13.5" font-weight="bold" fill="#3b2a1a" text-anchor="middle">THEN, YOUR CHOICE</text><text x="618" y="305" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">Reroll the song (1 Inspiration)</text>
<text x="618" y="319" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">Play another song</text>
<text x="618" y="333" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">Or retreat, any time</text><line x1="380" y1="356" x2="380" y2="384" stroke="#3b2a1a" stroke-width="2"/><path d="M380,384 L383.9146898070011,375.8959760788259 L376.0853101929989,375.8959760788259 Z" fill="#3b2a1a"/><rect x="110" y="384" width="540" height="80" rx="8" fill="#e3efe0" stroke="#3f8f4a" stroke-width="1.8"/><text x="380" y="406" font-size="13.5" font-weight="bold" fill="#3f8f4a" text-anchor="middle">FIGHT ENDS</text><text x="380" y="425" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">Every monster tamed: claim Fame &amp; Glory. Clear the space, gain 1 Inspiration,</text>
<text x="380" y="439" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">and radiate an element to the spaces next door.  Retreat: keep what you earned.</text>
<text x="380" y="453" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="middle">EXP is paid for every monster you wounded (all of them after a win).</text>
</svg>
