<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Setup: a bard mat and the six setup steps" font-family="Georgia, 'Times New Roman', serif">
<title>Setup: a bard mat and the six setup steps</title>
<rect width="760" height="380" fill="#fbf6e9"/>
<rect x="3" y="3" width="754" height="374" fill="none" stroke="#cdbb98" stroke-width="1.5" rx="10"/>
<rect x="24" y="24" width="440" height="330" rx="8" fill="#fffdf6" stroke="#3b2a1a" stroke-width="1.6"/><rect x="24" y="24" width="440" height="30" rx="8" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.6"/><text x="244" y="45" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle" letter-spacing="1.5">A BARD'S MAT</text><text x="44" y="74" font-size="13" font-weight="normal" fill="#7a6650" text-anchor="start" font-style="italic">Setlist: six songs, one die each</text><rect x="44" y="90" width="124" height="98" rx="8" fill="#f3d4d0" stroke="#c23b3b" stroke-width="2.5"/><text x="52" y="108" font-size="12" font-weight="bold" fill="#7a6650" text-anchor="start">Song 1</text><polygon points="106.0,114.0 134.0,142.0 106.0,170.0 78.0,142.0" fill="#c23b3b" stroke="#3b2a1a" stroke-width="2" stroke-linejoin="round"/><text x="106" y="147" font-size="11.76" font-weight="bold" fill="#3b2a1a" text-anchor="middle">d8</text><text x="106" y="180" font-size="10.5" font-weight="bold" fill="#c23b3b" text-anchor="middle">your starter d8</text><rect x="182" y="90" width="124" height="98" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5" stroke-dasharray="5 4"/><text x="190" y="108" font-size="12" font-weight="bold" fill="#7a6650" text-anchor="start">Song 2</text><text x="244" y="152" font-size="12" font-weight="normal" fill="#cdbb98" text-anchor="middle" font-style="italic">empty</text><rect x="320" y="90" width="124" height="98" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5" stroke-dasharray="5 4"/><text x="328" y="108" font-size="12" font-weight="bold" fill="#7a6650" text-anchor="start">Song 3</text><text x="382" y="152" font-size="12" font-weight="normal" fill="#cdbb98" text-anchor="middle" font-style="italic">empty</text><rect x="44" y="202" width="124" height="98" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5" stroke-dasharray="5 4"/><text x="52" y="220" font-size="12" font-weight="bold" fill="#7a6650" text-anchor="start">Song 4</text><text x="106" y="264" font-size="12" font-weight="normal" fill="#cdbb98" text-anchor="middle" font-style="italic">empty</text><rect x="182" y="202" width="124" height="98" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5" stroke-dasharray="5 4"/><text x="190" y="220" font-size="12" font-weight="bold" fill="#7a6650" text-anchor="start">Song 5</text><text x="244" y="264" font-size="12" font-weight="normal" fill="#cdbb98" text-anchor="middle" font-style="italic">empty</text><rect x="320" y="202" width="124" height="98" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5" stroke-dasharray="5 4"/><text x="328" y="220" font-size="12" font-weight="bold" fill="#7a6650" text-anchor="start">Song 6</text><text x="382" y="264" font-size="12" font-weight="normal" fill="#cdbb98" text-anchor="middle" font-style="italic">empty</text><rect x="44" y="318" width="128" height="26" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5"/><text x="52" y="336" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="start">Fame</text><text x="164" y="336" font-size="15" font-weight="bold" fill="#3b2a1a" text-anchor="end">0</text><rect x="182" y="318" width="128" height="26" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5"/><text x="190" y="336" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="start">EXP</text><text x="302" y="336" font-size="15" font-weight="bold" fill="#3b2a1a" text-anchor="end">0</text><rect x="320" y="318" width="128" height="26" rx="8" fill="#fffdf6" stroke="#cdbb98" stroke-width="1.5"/><text x="328" y="336" font-size="12" font-weight="normal" fill="#7a6650" text-anchor="start">Inspiration</text><text x="440" y="336" font-size="15" font-weight="bold" fill="#3b2a1a" text-anchor="end">1</text><circle cx="500" cy="54" r="13" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.5"/><text x="500" y="59" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle">1</text><text x="522" y="50" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="start">Pick your element</text><text x="522" y="67" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start">Each bard picks a different one: Ballad,</text>
<text x="522" y="81" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start">Folk, Hymn or Shanty.</text><circle cx="500" cy="108" r="13" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.5"/><text x="500" y="113" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle">2</text><text x="522" y="104" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="start">Place the board</text><text x="522" y="121" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start">The 4×4 realm of 16 spaces. Bards start</text>
<text x="522" y="135" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start">on the corners.</text><circle cx="500" cy="162" r="13" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.5"/><text x="500" y="167" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle">3</text><text x="522" y="158" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="start">Take your mat</text><text x="522" y="175" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start">One d8 of your element in Song 1. 1</text>
<text x="522" y="189" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start">Inspiration, 0 Fame, 0 EXP.</text><circle cx="500" cy="216" r="13" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.5"/><text x="500" y="221" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle">4</text><text x="522" y="212" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="start">Deal the chips</text><text x="522" y="229" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start">One element chip per space, the same</text>
<text x="522" y="243" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start">number of each element, shuffled.</text><circle cx="500" cy="270" r="13" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.5"/><text x="500" y="275" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle">5</text><text x="522" y="266" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="start">Fix your corner</text><text x="522" y="283" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start">Swap chips so your starting space holds</text>
<text x="522" y="297" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start">a chip of your own element.</text><circle cx="500" cy="324" r="13" fill="#3b2a1a" stroke="#3b2a1a" stroke-width="1.5"/><text x="500" y="329" font-size="14" font-weight="bold" fill="#fbf6e9" text-anchor="middle">6</text><text x="522" y="320" font-size="14" font-weight="bold" fill="#3b2a1a" text-anchor="start">Stock the Studio</text><text x="522" y="337" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start">Draw 4 element chips and 2 styles to the</text>
<text x="522" y="351" font-size="11.5" font-weight="normal" fill="#7a6650" text-anchor="start">shelves.</text>
</svg>
